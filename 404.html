<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面不存在 | Jankin's Timeline</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .error-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .error-code { font-size: 6rem; font-weight: 700; color: var(--color-primary); margin: 0; line-height: 1; }
    .error-message { font-size: 1.5rem; color: var(--color-text); margin: 1rem 0; }
    .error-description { color: var(--color-text-secondary); margin-bottom: 2rem; max-width: 400px; }
    .error-back { display: inline-block; padding: 0.75rem 2rem; background: var(--color-primary); color: #fff; text-decoration: none; border-radius: var(--border-radius); transition: opacity 0.2s; }
    .error-back:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="error-container">
    <h1 class="error-code">404</h1>
    <p class="error-message">页面不存在</p>
    <p class="error-description">抱歉，您访问的页面不存在或已被移除。请检查网址是否正确，或返回首页继续浏览。</p>
    <a href="index.html" class="error-back">返回首页</a>
  </div>
</body>
</html>
