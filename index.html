  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238b6914'/%3E%3Cpath d='M16 6v20M10 10h12M10 16h12M10 22h8' stroke='%23fdfbf7' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Jankin's Timeline</title>
  <script>
    (function () {
      try {
        var theme = null;
        var nameEQ = 'jankin-theme=';
        var ca = document.cookie.split(';');
        for (var i = 0; i < ca.length; i++) {
          var c = ca[i].trim();
          if (c.indexOf(nameEQ) === 0) {
            theme = decodeURIComponent(c.substring(nameEQ.length));
            break;
          }
        }
        if (!theme) {
          var saved = localStorage.getItem('jankin-theme');
          if (saved) {
            theme = saved;
            var host = location.hostname;
            var isLocal = host === 'localhost' || host === '127.0.0.1' || /^\d+\.\d+\.\d+\.\d+$/.test(host);
            var domain = isLocal ? '' : ('; domain=.' + host.split('.').slice(-2).join('.'));
            var d = new Date(); d.setTime(d.getTime() + 365 * 24 * 60 * 60 * 1000);
            document.cookie = 'jankin-theme=' + encodeURIComponent(saved) + '; expires=' + d.toUTCString() + domain + '; path=/; SameSite=Lax';
          }
        }
        theme = theme || 'mono';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <script>
    (function() {
      var headerRow = document.querySelector('.site-header-row');
      if (!headerRow) return;
      var ticking = false;
      function updateHeaderHeight() {
        var h = Math.min(headerRow.offsetHeight || 0, 400);
        document.documentElement.style.setProperty('--header-height', h + 'px');
      }
      function update() {
        var isCompact = window.scrollY > 80;
        if (headerRow.classList.contains('compact') !== isCompact) {
          headerRow.classList.toggle('compact', isCompact);
          requestAnimationFrame(updateHeaderHeight);
        }
        ticking = false;
      }
      window.addEventListener('scroll', function() {
        if (!ticking) { requestAnimationFrame(update); ticking = true; }
      }, { passive: true });
      window.addEventListener('resize', updateHeaderHeight);
      update();
      updateHeaderHeight();
    })();
  </script>
