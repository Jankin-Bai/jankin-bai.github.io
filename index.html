<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jankin's Timeline</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Jankin's Timeline</h1>
    <p class="site-subtitle">一纵一横，记录思想与历程</p>
  </header>
  <main class="app-layout">
    <div class="main-area">
      <div class="toolbar">
        <div class="toolbar-group">
          <span class="toolbar-label">视图</span>
          <button class="toolbar-btn active" data-view="timeline">时间线</button>
          <button class="toolbar-btn" data-view="matrix">矩阵</button>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="milestone-only"> 仅里程碑
        </label>
        <div class="theme-toolbar-group">
          <div class="theme-switcher">
            <button class="theme-trigger" aria-haspopup="listbox">
              <span class="theme-current-name">默认书卷</span>
              <span class="theme-trigger-chevron">▾</span>
            </button>
            <div class="theme-dropdown" role="listbox">
              <div class="theme-option" data-theme="default">默认书卷</div>
              <div class="theme-option" data-theme="serif">学术书卷</div>
              <div class="theme-option" data-theme="mono">终端极客</div>
              <div class="theme-option" data-theme="minimal">极简黑白</div>
              <div class="theme-option" data-theme="warm">暖色复古</div>
              <div class="theme-option" data-theme="dark">深色护眼</div>
            </div>
          </div>
        </div>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="搜索标题、摘要或标签...">
        </div>
      </div>
      <div id="content-area"></div>
    </div>
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3 class="sidebar-title">标签筛选</h3>
        <div class="dim-list" id="dim-list"></div>
      </div>
      <div class="sidebar-section">
        <h3 class="sidebar-title">关于</h3>
        <p style="font-size:0.88rem;color:var(--color-text-secondary);line-height:1.7;">这是一个博客</p>
      </div>
      <div class="sidebar-section">
        <h3 class="sidebar-title">操作</h3>
        <a href="index.html" class="post-sidebar-link">🏠 时间线首页</a>
      </div>
    </aside>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/ganzhi.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
