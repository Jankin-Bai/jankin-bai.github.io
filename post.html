<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博文 | Jankin's Timeline</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="post-layout">
    <article class="post-article">
      <a href="index.html" class="back-link">← 返回时间线</a>
      <div class="post-header">
        <div class="post-meta" id="post-meta"></div>
        <h1 class="post-title" id="post-title"></h1>
        <div class="post-tags" id="post-tags"></div>
      </div>
      <div class="post-content" id="post-content"></div>
      <div class="post-nav" id="post-nav"></div>
    </article>
    <aside class="post-sidebar">
      <div class="post-sidebar-section">
        <h3 class="post-sidebar-title">文章目录</h3>
        <div id="toc-container"><p style="font-size:0.85rem;color:var(--color-text-muted);">正在生成目录...</p></div>
      </div>
      <div class="post-sidebar-section">
        <h3 class="post-sidebar-title">标签</h3>
        <div class="dim-list" id="post-dim-list"></div>
      </div>
      <div class="post-sidebar-section">
        <h3 class="post-sidebar-title">操作</h3>
        <a href="index.html" class="post-sidebar-link">🏠 时间线首页</a>
      </div>
      <div class="post-sidebar-section">
        <h3 class="post-sidebar-title">主题</h3>
        <div class="theme-switcher">
          <button class="theme-trigger" aria-haspopup="listbox">
            <span class="theme-current-name">默认书卷</span>
            <span class="theme-trigger-chevron">▾</span>
          </button>
          <div class="theme-dropdown" role="listbox">
            <div class="theme-option" data-theme="default">默认书卷</div>
            <div class="theme-option" data-theme="serif">学术书卷</div>
            <div class="theme-option" data-theme="mono">终端极客</div>
            <div class="theme-option" data-theme="minimal">极简黑白</div>
            <div class="theme-option" data-theme="warm">暖色复古</div>
            <div class="theme-option" data-theme="dark">深色护眼</div>
          </div>
        </div>
      </div>
    </aside>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/ganzhi.js"></script>
  <script src="assets/js/post.js"></script>
</body>
</html>
