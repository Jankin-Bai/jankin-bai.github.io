<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <meta name="robots" content="noindex, follow">
  <title>404 - 页面未找到 | Jankin's Timeline</title>
  <!-- 防闪烁 -->
  <script>
    (function () {
      try {
        var theme = null;
        var nameEQ = 'jankin-theme=';
        var ca = document.cookie.split(';');
        for (var i = 0; i < ca.length; i++) {
          var c = ca[i].trim();
          if (c.indexOf(nameEQ) === 0) {
            theme = decodeURIComponent(c.substring(nameEQ.length));
            break;
          }
        }
        if (!theme) {
          var saved = localStorage.getItem('jankin-theme');
          if (saved) {
            theme = saved;
            var host = location.hostname;
            var isLocal = host === 'localhost' || host === '127.0.0.1' || /^\d+\.\d+\.\d+\.\d+$/.test(host);
            var domain = isLocal ? '' : ('; domain=.' + host.split('.').slice(-2).join('.'));
            var d = new Date(); d.setTime(d.getTime() + 365 * 24 * 60 * 60 * 1000);
            document.cookie = 'jankin-theme=' + encodeURIComponent(saved) + '; expires=' + d.toUTCString() + domain + '; path=/; SameSite=Lax';
          }
        }
        theme = theme || 'mono';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css?v=20260904b">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* 404 页面专属：内容区居中，无侧栏 [frontend: Cover 原语] */
    .error-page {
      min-height: calc(100vh - 200px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--sp-8) var(--sp-6);
      max-width: 600px;
      margin: 0 auto;
    }
    .error-code {
      font-family: var(--font-family-serif);

      line-height: 1;
      color: var(--color-primary);
      margin-bottom: var(--sp-4);
      letter-spacing: -0.02em;
    }
    .error-title {
      font-family: var(--font-family-serif);
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: var(--sp-3);
    }
    .error-message {
      font-size: var(--fs-base);
      color: var(--color-text-secondary);
      line-height: 1.8;
      max-width: 480px;
      margin-bottom: var(--sp-7);
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-3);
      justify-content: center;
    }
    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-6);
      font-size: var(--fs-base);
      font-weight: 500;
      border-radius: var(--border-radius);
      text-decoration: none;
      transition: all var(--transition);
      cursor: pointer;
      border: 1px solid transparent;
    }
    .error-btn-primary {
      background: var(--color-primary);
      color: var(--color-surface);
    }
    .error-btn-primary:hover {
      background: var(--color-primary-dark);
      text-decoration: none;
      transform: translateY(-1px);
      box-shadow: var(--card-shadow-hover);
    }
    .error-btn-secondary {
      background: transparent;
      color: var(--color-text-secondary);
      border-color: var(--color-border);
    }
    .error-btn-secondary:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      text-decoration: none;
    }
    .error-footer {
      margin-top: var(--sp-10);
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
      font-family: var(--font-family-mono);
    }
    /* 404 页隐藏视图切换和里程碑，只保留主题切换和搜索 */
    .page-404 .toolbar-group.view-group,
    .page-404 .checkbox-label {
      display: none !important;
    }
    .page-404 .toolbar {
      grid-template-columns: 1fr auto;
    }
    .page-404 .search-box { grid-column: 1; }
    .page-404 .theme-toolbar-group { grid-column: 2; }
    @media (prefers-reduced-motion: reduce) {
      .error-btn-primary, .error-btn-secondary { transition: none; }
      .error-btn-primary:hover { transform: none; }
    }
  </style>
</head>

  <script>
    (function() {
      var headerRow = document.querySelector('.site-header-row');
      if (!headerRow) return;
      function updateHeaderHeight() {
        var h = Math.min(headerRow.offsetHeight || 0, 400);
        document.documentElement.style.setProperty('--header-height', h + 'px');
      }
      window.addEventListener('resize', updateHeaderHeight);
      updateHeaderHeight();
    })();
