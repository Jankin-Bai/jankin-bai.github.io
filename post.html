  <title>博文 | Jankin's Timeline</title>
  <script>
    (function () {
      try {
        var theme = null;
        var nameEQ = 'jankin-theme=';
        var ca = document.cookie.split(';');
        for (var i = 0; i < ca.length; i++) {
          var c = ca[i].trim();
          if (c.indexOf(nameEQ) === 0) { theme = decodeURIComponent(c.substring(nameEQ.length)); break; }
        }
        if (!theme) {
          var saved = localStorage.getItem('jankin-theme');
          if (saved) {
            theme = saved;
            var host = location.hostname;
            var isLocal = host === 'localhost' || host === '127.0.0.1' || /^\d+\.\d+\.\d+\.\d+$/.test(host);
            var domain = isLocal ? '' : ('; domain=.' + host.split('.').slice(-2).join('.'));
            var d = new Date(); d.setTime(d.getTime() + 365 * 24 * 60 * 60 * 1000);
            document.cookie = 'jankin-theme=' + encodeURIComponent(saved) + '; expires=' + d.toUTCString() + domain + '; path=/; SameSite=Lax';
          }
        }
        theme = theme || 'mono';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <!-- 阅读模式：滚动>180px 时页眉全隐藏，显示42px标题条 [决策4C] -->
  <script>
    (function() {
      var headerRow = document.querySelector('.site-header-row');
      var readingHeader = document.getElementById('readingHeader');
      var readingHeaderTitle = document.getElementById('readingHeaderTitle');
      var postTitle = document.getElementById('post-title');
      var ticking = false;
      function syncTitle() {
        if (postTitle && readingHeaderTitle) {
          readingHeaderTitle.textContent = postTitle.textContent || '';
        }
      }
      setTimeout(syncTitle, 300);
      var observer = new MutationObserver(syncTitle);
      if (postTitle) observer.observe(postTitle, { childList: true, characterData: true, subtree: true });
      function updateHeaderHeight() {
        if (headerRow) {
          var h = Math.min(headerRow.offsetHeight || 0, 400);
          document.documentElement.style.setProperty('--header-height', h + 'px');
        }
      }
      function update() {
        // 滞后（hysteresis）：进入阅读模式阈值高，退出阈值低，避免来回闪烁 [hci: 防止误触发]
        var isReading = document.body.classList.contains('reading-mode');
        var threshold = isReading ? 150 : 320;  // 已在阅读模式则150px退出，否则320px进入
        var shouldBeReading = window.scrollY > threshold;
        if (isReading !== shouldBeReading) {
          document.body.classList.toggle('reading-mode', shouldBeReading);
          requestAnimationFrame(updateHeaderHeight);
        }
        ticking = false;
      }
      window.addEventListener('scroll', function() {
        if (!ticking) { requestAnimationFrame(update); ticking = true; }
      }, { passive: true });
      window.addEventListener('resize', updateHeaderHeight);
      update();
      updateHeaderHeight();
    })();
  </script>
