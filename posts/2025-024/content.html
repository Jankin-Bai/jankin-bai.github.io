<style>
/* ========== 复古科幻终端风格 - JANKIN RADIO 3000 ========== */
.radio-container {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 0;
  font-family: 'Courier New', 'Consolas', monospace;
  color: #8a9a7b;
}

/* ---- 顶部大显示屏 ---- */
.radio-top-display {
  background: linear-gradient(145deg, #9aa88a, #7d8b6f);
  border: 3px solid #2a2a2a;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 12px;
  position: relative;
  min-height: 140px;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.5);
  clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
}

.radio-top-display::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  pointer-events: none;
}

.display-station-name {
  font-size: 1.6em;
  font-weight: bold;
  color: #2a3a2a;
  text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.display-station-desc {
  font-size: 0.85em;
  color: #4a5a4a;
  margin-bottom: 12px;
}

.display-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.8em;
  color: #3a4a3a;
  border-top: 1px dashed rgba(0,0,0,0.2);
  padding-top: 8px;
}

.display-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* 波形动画 */
.waveform {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 30px;
  margin-top: 8px;
}

.waveform .bar {
  width: 4px;
  background: #3a5a3a;
  border-radius: 2px;
  animation: wave 1s ease-in-out infinite;
}

.waveform .bar:nth-child(1) { animation-delay: 0s; height: 40%; }
.waveform .bar:nth-child(2) { animation-delay: 0.1s; height: 70%; }
.waveform .bar:nth-child(3) { animation-delay: 0.2s; height: 50%; }
.waveform .bar:nth-child(4) { animation-delay: 0.3s; height: 90%; }
.waveform .bar:nth-child(5) { animation-delay: 0.4s; height: 60%; }
.waveform .bar:nth-child(6) { animation-delay: 0.5s; height: 80%; }
.waveform .bar:nth-child(7) { animation-delay: 0.6s; height: 45%; }
.waveform .bar:nth-child(8) { animation-delay: 0.7s; height: 75%; }

@keyframes wave {
  0%, 100% { transform: scaleY(0.5); }
  50% { transform: scaleY(1); }
}

.waveform.paused .bar {
  animation-play-state: paused;
  opacity: 0.4;
}

/* ---- 品牌标识区 ---- */
.radio-brand-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding: 0 4px;
}

.brand-bars {
  display: flex;
  gap: 4px;
}

.brand-bars span {
  width: 18px;
  height: 22px;
  background: linear-gradient(180deg, #c9a84c, #8a7030);
  border: 1px solid #5a4a20;
  border-radius: 2px;
}

.brand-title {
  flex: 1;
  text-align: center;
}

.brand-title .main {
  font-size: 1.8em;
  font-weight: bold;
  color: #e0e0e0;
  letter-spacing: 4px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.brand-title .sub {
  font-size: 0.9em;
  color: #c04040;
  letter-spacing: 6px;
  font-weight: bold;
}

.brand-date {
  font-size: 0.75em;
  color: #888;
  text-align: right;
  min-width: 60px;
}

/* ---- 雷达 + 信息面板 ---- */
.radio-radar-info {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
}

.radar-panel {
  width: 120px;
  height: 120px;
  background: #1a2a1a;
  border: 2px solid #3a5a3a;
  border-radius: 50%;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

.radar-panel::before {
  content: '';
  position: absolute;
  top: 50%; left: 0; right: 0;
  height: 1px;
  background: rgba(58, 90, 58, 0.5);
}

.radar-panel::after {
  content: '';
  position: absolute;
  left: 50%; top: 0; bottom: 0;
  width: 1px;
  background: rgba(58, 90, 58, 0.5);
}

.radar-ring {
  position: absolute;
  border: 1px solid rgba(58, 90, 58, 0.4);
  border-radius: 50%;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

.radar-ring.r1 { width: 40px; height: 40px; }
.radar-ring.r2 { width: 70px; height: 70px; }
.radar-ring.r3 { width: 100px; height: 100px; }

.radar-sweep {
  position: absolute;
  top: 50%; left: 50%;
  width: 50%; height: 2px;
  background: linear-gradient(90deg, rgba(100, 255, 100, 0.8), transparent);
  transform-origin: left center;
  animation: radar-sweep 3s linear infinite;
}

@keyframes radar-sweep {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.radar-center {
  position: absolute;
  top: 50%; left: 50%;
  width: 12px; height: 12px;
  background: #4a8a4a;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px #4a8a4a;
}

.radar-panel.paused .radar-sweep {
  animation-play-state: paused;
  opacity: 0.3;
}

.info-panel {
  flex: 1;
  background: #1a1a1a;
  border: 2px solid #8a3030;
  border-radius: 8px;
  padding: 12px;
  font-size: 0.8em;
  line-height: 1.8;
}

.info-panel .info-row {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px dotted #333;
  padding: 2px 0;
}

.info-panel .info-label {
  color: #666;
}

.info-panel .info-value {
  color: #aaa;
  font-weight: bold;
}

.info-panel .info-value.playing {
  color: #4a8a4a;
}

/* ---- 世界地图面板 ---- */
.map-panel {
  background: #1a2a2a;
  border: 2px solid #4a6a6a;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 12px;
  position: relative;
}

.map-panel .panel-label {
  position: absolute;
  top: -10px;
  right: 12px;
  background: #1a1a1a;
  padding: 0 8px;
  font-size: 0.75em;
  color: #8a8a6a;
  letter-spacing: 2px;
}

.world-map {
  width: 100%;
  height: 200px;
  display: block;
}

.map-station {
  cursor: pointer;
  transition: all 0.2s;
}

.map-station circle {
  fill: #4aff4a;
  stroke: #2a5a2a;
  stroke-width: 0.5;
  transition: all 0.2s;
}

.map-station:hover circle {
  fill: #7fff7f;
  r: 5;
  filter: drop-shadow(0 0 3px rgba(127,255,127,0.8));
}

.map-station.playing circle {
  fill: #ff4757;
  r: 4;
  filter: drop-shadow(0 0 4px rgba(255,71,87,0.9));
}

/* 十字瞄准镜（独立元素，跟随播放位置） */
.crosshair {
  position: absolute;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 10;
}

.crosshair.active {
  opacity: 1;
}

.crosshair svg {
  overflow: visible;
}

.crosshair .ch-line {
  stroke: #ff4757;
  stroke-width: 1.2;
  fill: none;
}

.crosshair .ch-ring {
  fill: none;
  stroke: #ff4757;
  stroke-width: 1;
}

.crosshair .ch-ring.inner {
  animation: ch-ring-pulse 2s ease-in-out infinite;
}

.crosshair .ch-ring.outer {
  animation: ch-ring-pulse 2s ease-in-out infinite 0.5s;
}

.crosshair .ch-corner {
  stroke: #ff4757;
  stroke-width: 1.5;
  fill: none;
}

@keyframes ch-ring-pulse {
  0%, 100% { opacity: 0.9; stroke-width: 1; }
  50% { opacity: 0.4; stroke-width: 0.5; }
}

.map-station text {
  fill: #a0b0a0;
  font-size: 8px;
  font-family: 'Courier New', monospace;
  font-weight: bold;
}

/* ---- 分类筛选 ---- */
.radio-categories {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  justify-content: center;
}

.category-btn {
  padding: 6px 16px;
  background: transparent;
  border: 1px solid #4a5a4a;
  color: #8a9a7b;
  font-family: 'Courier New', monospace;
  font-size: 0.8em;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
  letter-spacing: 1px;
}

.category-btn:hover {
  border-color: #6a8a6a;
  color: #aaba9b;
}

.category-btn.active {
  background: #2a4a2a;
  border-color: #4a8a4a;
  color: #8aff8a;
  box-shadow: 0 0 8px rgba(74, 138, 74, 0.3);
}

/* ---- 电台列表 ---- */
.radio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}

.radio-card {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}

.radio-card:hover {
  border-color: #4a8a4a;
  background: #1a2a1a;
}

.radio-card.playing {
  border-color: #4aff4a;
  background: #1a2a1a;
  box-shadow: 0 0 12px rgba(74, 255, 74, 0.2);
}

.radio-card.playing::before {
  content: '▶ LIVE';
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 0.65em;
  color: #4aff4a;
  font-weight: bold;
  animation: blink 1s step-end infinite;
}

@keyframes blink {
  50% { opacity: 0.3; }
}

.radio-card-name {
  font-size: 0.95em;
  font-weight: bold;
  color: #c0c0b0;
  margin-bottom: 4px;
}

.radio-card-desc {
  font-size: 0.75em;
  color: #666;
  line-height: 1.4;
  margin-bottom: 6px;
}

.radio-card-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.7em;
  color: #555;
}

.radio-card-format {
  color: #8a6a3a;
}

/* ---- 太阳系轨道 - 休眠定时器 ---- */
.planet-panel {
  background: #1a1a2a;
  border: 2px solid #8a3030;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  position: relative;
}

.planet-panel .panel-label {
  position: absolute;
  top: -10px;
  right: 12px;
  background: #1a1a1a;
  padding: 0 8px;
  font-size: 0.75em;
  color: #8a8a6a;
  letter-spacing: 2px;
}

.solar-system {
  position: relative;
  width: 100%;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.orbit {
  position: absolute;
  border: 1px solid rgba(138, 138, 106, 0.2);
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.orbit.o1 { width: 40px; height: 40px; }
.orbit.o2 { width: 70px; height: 70px; }
.orbit.o3 { width: 100px; height: 100px; }
.orbit.o4 { width: 130px; height: 130px; }
.orbit.o5 { width: 160px; height: 160px; }

.sun {
  position: absolute;
  width: 14px;
  height: 14px;
  background: radial-gradient(circle, #ffaa00, #cc6600);
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 12px #ffaa00;
}

.planet {
  position: absolute;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  cursor: pointer;
  transition: all 0.3s;
}

.planet:hover {
  filter: brightness(1.5);
}

.planet.p1 { width: 6px; height: 6px; background: #888; }
.planet.p2 { width: 8px; height: 8px; background: #c8a060; }
.planet.p3 { width: 9px; height: 9px; background: #4a8aff; }
.planet.p4 { width: 7px; height: 7px; background: #c04040; }
.planet.p5 { width: 12px; height: 12px; background: #c8a080; }

.planet.active {
  box-shadow: 0 0 12px #fff;
}

.sleep-info {
  text-align: center;
  margin-top: 8px;
  font-size: 0.8em;
  color: #8a9a7b;
}

.sleep-info .remaining {
  color: #4aff4a;
  font-weight: bold;
  font-size: 1.2em;
}

/* ---- 底部控制区 ---- */
.control-panel {
  background: #1a1a1a;
  border: 2px solid #4a4a4a;
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 12px;
}

.control-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

.play-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(145deg, #3a5a3a, #2a4a2a);
  border: 2px solid #4a8a4a;
  color: #8aff8a;
  font-size: 1.2em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  box-shadow: 0 0 10px rgba(74, 138, 74, 0.3);
}

.play-btn:hover {
  background: linear-gradient(145deg, #4a6a4a, #3a5a3a);
  box-shadow: 0 0 16px rgba(74, 255, 74, 0.4);
}

.play-btn:active {
  transform: scale(0.95);
}

.volume-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.volume-icon {
  cursor: pointer;
  font-size: 1.2em;
  user-select: none;
}

.volume-slider {
  width: 100px;
  -webkit-appearance: none;
  height: 4px;
  background: #333;
  border-radius: 2px;
  outline: none;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  background: #8a8a6a;
  border-radius: 50%;
  cursor: pointer;
}

.sleep-buttons {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.sleep-btn {
  padding: 5px 10px;
  background: transparent;
  border: 1px solid #4a5a4a;
  color: #8a9a7b;
  font-family: 'Courier New', monospace;
  font-size: 0.75em;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
}

.sleep-btn:hover {
  border-color: #6a8a6a;
  color: #aaba9b;
}

.sleep-btn.active {
  background: #2a4a2a;
  border-color: #4a8a4a;
  color: #8aff8a;
}

.sleep-custom-input {
  width: 60px;
  padding: 4px 6px;
  background: #1a1a1a;
  border: 1px solid #4a5a4a;
  color: #8a9a7b;
  font-family: 'Courier New', monospace;
  font-size: 0.75em;
  border-radius: 4px;
  text-align: center;
}

.sleep-custom-input:focus {
  outline: none;
  border-color: #4a8a4a;
}

.sleep-cancel-btn {
  color: #c04040;
  border-color: #6a3030;
}

.sleep-cancel-btn:hover {
  border-color: #c04040;
  color: #ff6060;
}

/* ---- 底部标识 ---- */
.radio-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  font-size: 0.75em;
  color: #666;
  border-top: 1px solid #333;
}

.radio-footer .galaxy-time {
  color: #8a8a6a;
  letter-spacing: 2px;
}

.radio-footer .water-resist {
  color: #aaa;
  letter-spacing: 1px;
}

.radio-footer .xb-logo {
  color: #c04040;
  font-weight: bold;
  border: 1px solid #c04040;
  padding: 2px 6px;
  border-radius: 3px;
}

/* ---- 错误提示 ---- */
.player-error {
  color: #ff6060;
  font-size: 0.8em;
  margin-top: 8px;
  padding: 8px;
  background: rgba(192, 64, 64, 0.1);
  border-radius: 4px;
  display: none;
  text-align: center;
}

.player-error.show {
  display: block;
}

/* ---- 响应式 ---- */
@media (max-width: 600px) {
  .radio-radar-info {
    flex-direction: column;
  }
  .radar-panel {
    margin: 0 auto;
  }
  .radio-grid {
    grid-template-columns: 1fr;
  }
  .world-map {
    height: 150px;
  }
  .control-row {
    gap: 8px;
  }
  .volume-slider {
    width: 70px;
  }
}
</style>

const audio = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');
const playerStatus = document.getElementById('playerStatus');
const playerStationName = document.getElementById('playerStationName');
const playerStationDesc = document.getElementById('playerStationDesc');
const playerError = document.getElementById('playerError');
const waveform = document.getElementById('waveform');
const radarPanel = document.getElementById('radarPanel');
let currentStation = null;
let isPlaying = false;
let hlsInstance = null;

const categoryNames = { cnr: '央广系列', local: '地方电台', hkmt: '港澳台', music: '音乐电台', internet: '网络音乐', singapore: '新加坡', international: '国际广播', ambient: '氛围音乐', russian: '俄语电台', arabic: '阿拉伯语', all: '全部' };

function renderStations(category) {
  category = category || 'all';
  const list = document.getElementById('radioList');
  const filtered = category === 'all' ? stations : stations.filter(s => s.category === category);
  list.innerHTML = filtered.map(s =>
    '<div class="radio-card ' + (currentStation && currentStation.id === s.id ? 'playing' : '') + '" data-id="' + s.id + '" onclick="playStation(\'' + s.id + '\')">' +
    '<div class="radio-card-name">' + s.name + '</div>' +
    '<div class="radio-card-desc">' + s.desc + '</div>' +
    '<div class="radio-card-meta"><span class="radio-card-format">' + s.format + '</span><span>' + s.freq + ' MHz</span></div>' +
    '</div>'
  ).join('');
}

async function playStation(id) {
  const station = stations.find(s => s.id === id);
  if (!station) return;
  if (currentStation && currentStation.id === id) { togglePlay(); return; }

  currentStation = station;
  playerStationName.textContent = station.name.toUpperCase();
  playerStationDesc.textContent = station.desc;
  document.getElementById('displayFreq').textContent = 'FREQ: ' + station.freq + ' MHz';
  document.getElementById('displaySignal').textContent = 'SIGNAL: ████░░';
  document.getElementById('infoFormat').textContent = station.format;
  document.getElementById('infoCategory').textContent = categoryNames[station.category] || station.category;

  document.querySelectorAll('.map-station').forEach(el => el.classList.remove('playing'));
  const mapPoint = document.querySelector('.map-station[data-id="' + id + '"]');
  if (mapPoint) mapPoint.classList.add('playing');
  // 移动十字瞄准镜
  if (typeof moveCrosshair === 'function') moveCrosshair(id);

  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  audio.pause();
  audio.removeAttribute('src');
  audio.load();

  playerStatus.textContent = '● CONNECTING...';
  document.getElementById('infoStatus').textContent = 'CONNECTING';
  playerStatus.style.color = '#c8a060';

  try {
    if (station.url.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(station.url);
      hlsInstance.attachMedia(audio);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        audio.play().then(startPlaying).catch(err => showError('play failed: ' + err.message));
      });
      hlsInstance.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) showError('stream error: ' + data.type);
      });
    } else {
      audio.src = station.url;
      audio.load();
      audio.addEventListener('canplay', function startPlay() {
        audio.removeEventListener('canplay', startPlay);
        audio.play().then(startPlaying).catch(err => showError('play failed: ' + err.message));
      }, { once: true });
      setTimeout(() => { if (!isPlaying) showError('连接超时，请尝试其他电台'); }, 10000);
    }
  } catch (e) {
    showError('exception: ' + e.message);
  }
  renderStations(currentCategory);
}

function startPlaying() {
  isPlaying = true;
  playBtn.textContent = '⏸';
  playerStatus.textContent = '● ON AIR';
  playerStatus.style.color = '#4aff4a';
  document.getElementById('infoStatus').textContent = 'PLAYING';
  document.getElementById('infoStatus').classList.add('playing');
  document.getElementById('displaySignal').textContent = 'SIGNAL: ██████';
  waveform.classList.remove('paused');
  radarPanel.classList.remove('paused');
  playerError.style.display = 'none';
}

function stopPlay() {
  isPlaying = false;
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  audio.pause();
  playBtn.textContent = '▶';
  playerStatus.textContent = '● STANDBY';
  playerStatus.style.color = '#8a9a7b';
  document.getElementById('infoStatus').textContent = 'IDLE';
  document.getElementById('infoStatus').classList.remove('playing');
  document.getElementById('displaySignal').textContent = 'SIGNAL: ----';
  waveform.classList.add('paused');
  radarPanel.classList.add('paused');
  document.querySelectorAll('.map-station').forEach(el => el.classList.remove('playing'));
  if (typeof crosshair !== 'undefined') crosshair.classList.remove('active');
  renderStations(currentCategory);
}

function togglePlay() {
  if (!currentStation) { showError('请先选择一个电台'); return; }
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
    playBtn.textContent = '▶';
    playerStatus.textContent = '● PAUSED';
    playerStatus.style.color = '#c8a060';
    document.getElementById('infoStatus').textContent = 'PAUSED';
    waveform.classList.add('paused');
    radarPanel.classList.add('paused');
  } else {
    audio.play().then(() => {
      isPlaying = true;
      playBtn.textContent = '⏸';
      playerStatus.textContent = '● ON AIR';
      playerStatus.style.color = '#4aff4a';
      document.getElementById('infoStatus').textContent = 'PLAYING';
      waveform.classList.remove('paused');
      radarPanel.classList.remove('paused');
    }).catch(err => showError('play failed: ' + err.message));
  }
}

let lastVolume = 80;
let isMuted = false;
function setVolume(value) {
  audio.volume = value / 100;
  document.getElementById('infoVolume').textContent = value + '%';
  if (value > 0) { isMuted = false; document.querySelector('.volume-icon').textContent = '🔊'; }
}
function toggleMute() {
  if (isMuted) {
    audio.volume = lastVolume / 100;
    document.getElementById('volumeSlider').value = lastVolume;
    isMuted = false;
    document.querySelector('.volume-icon').textContent = '🔊';
  } else {
    lastVolume = document.getElementById('volumeSlider').value;
    audio.volume = 0;
    document.getElementById('volumeSlider').value = 0;
    isMuted = true;
    document.querySelector('.volume-icon').textContent = '🔇';
  }
}

function showError(msg) {
  playerError.textContent = '⚠ ' + msg;
  playerError.style.display = 'block';
  setTimeout(() => { playerError.style.display = 'none'; }, 4000);
}

let currentCategory = 'all';
document.querySelectorAll('.category-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = btn.dataset.category;
    renderStations(currentCategory);
  });
});

crosshair.className = 'crosshair';
crosshair.innerHTML = `

  </svg>
`;
mapPanel.style.position = 'relative';
mapPanel.appendChild(crosshair);

// 移动十字瞄准镜到指定点位
function moveCrosshair(stationId) {
  const point = document.querySelector(`.map-station[data-id="${stationId}"]`);
  if (!point) { crosshair.classList.remove('active'); return; }
  const svg = document.querySelector('.world-map');
  const svgRect = svg.getBoundingClientRect();
  const panelRect = mapPanel.getBoundingClientRect();
  // 解析transform中的translate坐标
  const transform = point.getAttribute('transform');
  const match = transform.match(/translate\(([\d.]+),([\d.]+)\)/);
  if (match) {
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2]);
    // SVG坐标转像素（viewBox 800x400）
    const scaleX = svgRect.width / 800;
    const scaleY = svgRect.height / 400;
    const px = svgRect.left - panelRect.left + x * scaleX;
    const py = svgRect.top - panelRect.top + y * scaleY;
    crosshair.style.left = (px - 30) + 'px';
    crosshair.style.top = (py - 30) + 'px';
    crosshair.classList.add('active');
  }
}

document.querySelectorAll('.map-station').forEach(point => {
  point.addEventListener('click', () => {
    const id = point.dataset.id;
    if (id) playStation(id);
  });
});

/* ========== 休眠定时器 ========== */
let sleepTimerId = null;
let sleepEndTime = null;
let sleepRemainingInterval = null;

function setSleepTimer(minutes) {
  cancelSleepTimer();
  if (!minutes || minutes <= 0) return;
  const ms = minutes * 60 * 1000;
  sleepEndTime = Date.now() + ms;
  sleepTimerId = setTimeout(() => {
    stopPlay();
    cancelSleepTimer();
    showError('休眠时间到，已自动停止播放');
  }, ms);
  document.querySelectorAll('.sleep-btn[data-minutes]').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.minutes) === minutes);
  });
  document.querySelectorAll('.planet').forEach(p => {
    p.classList.toggle('active', parseInt(p.dataset.minutes) === minutes);
  });
  document.getElementById('sleepRemaining').style.display = 'inline';
  document.getElementById('sleepCancelBtn').style.display = 'inline-block';
  document.getElementById('sleepStatus').textContent = minutes + 'MIN';
  document.getElementById('infoSleep').textContent = minutes + 'MIN';
  updateSleepRemaining();
  sleepRemainingInterval = setInterval(updateSleepRemaining, 1000);
}

function setCustomSleepTimer() {
  const input = document.getElementById('sleepCustomInput');
  const minutes = parseInt(input.value);
  if (isNaN(minutes) || minutes < 1 || minutes > 180) {
    showError('请输入1-180之间的分钟数');
    return;
  }
  setSleepTimer(minutes);
  input.value = '';
}

function cancelSleepTimer() {
  if (sleepTimerId) { clearTimeout(sleepTimerId); sleepTimerId = null; }
  if (sleepRemainingInterval) { clearInterval(sleepRemainingInterval); sleepRemainingInterval = null; }
  sleepEndTime = null;
  document.querySelectorAll('.sleep-btn[data-minutes]').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.planet').forEach(p => p.classList.remove('active'));
  document.getElementById('sleepRemaining').style.display = 'none';
  document.getElementById('sleepCancelBtn').style.display = 'none';
  document.getElementById('sleepStatus').textContent = 'OFF';
  document.getElementById('infoSleep').textContent = 'OFF';
}

function updateSleepRemaining() {
  if (!sleepEndTime) return;
  const remaining = Math.max(0, sleepEndTime - Date.now());
  const min = Math.floor(remaining / 60000);
  const sec = Math.floor((remaining % 60000) / 1000);
  document.getElementById('sleepRemaining').textContent =
    String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

document.querySelectorAll('.sleep-btn[data-minutes]').forEach(btn => {
  btn.addEventListener('click', () => setSleepTimer(parseInt(btn.dataset.minutes)));
});

document.querySelectorAll('.planet[data-minutes]').forEach(planet => {
  planet.addEventListener('click', () => {
    const mins = planet.dataset.minutes;
    if (mins === 'custom') {
      document.getElementById('sleepCustomInput').focus();
    } else {
      setSleepTimer(parseInt(mins));
    }
  });
});

document.getElementById('sleepCustomInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') setCustomSleepTimer();
});

audio.volume = 0.8;
renderStations('all');
